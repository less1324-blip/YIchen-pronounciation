  <script>
    // =========================================================================
    // 版權所有：懿城文教機構 - 林哲宇
    // 專項音節發音鎖定：
    // 1. experience: ex [ɪks] , pe [pɪ] ("pih"), ri [rɪ] ("rih"), ence [əns] 
    // 2. impossible: im [ɪm] ("imme"), pos [pɑs] ("poss"), si [sə] ("suhh"), ble [bl] ("bəl")
    // 3. synthesis:  syn [sɪn] ("sin"), the [θə] ("thuhh"), sis [sɪs] ("siss")
    // =========================================================================
    const GITHUB_RAW_COMMIT_URL = "https://raw.githubusercontent.com/less1324-blip/YIchen-pronounciation/3efeec7870a37736168c0bf7e4007edaa45c1612/phonetic_schema.json";
    const GITHUB_RAW_MAIN_URL = "https://raw.githubusercontent.com/less1324-blip/YIchen-pronounciation/main/phonetic_schema.json";
    const LOCAL_SCHEMA_URL = "./phonetic_schema.json";

    let globalSpeechRate = 0.7;
    let isGuidingSyllables = false;
3

    // 單一音節精準發音對照表
    const REAL_WORD_HOMOPHONES = {
      "im":   "imme",   // 發 [ɪm]
      "pos":  "poss",   // 發 [pɑs]（對應 CMU 字典 POSS = P AA1 S，徹底杜絕 pahss 唸成 [pæs]）
      "si":   "suhh",   // 發 [sə]
      "ble":  "buhl",   // 發 [bl]
      "syn":  "sin",    // 發 [sɪn]
      "sis":  "siss",   // 發 [sɪs]
      "ex":   "ihks",   // 輕音字首 ex 發 [ɪks]（採用 ih 短母音結構，杜絕 [ɛks] 與 [aɪks]）
      "pe":   "pih",    // 發 [pɪ]
      "ri":   "rih",    // 發 [rɪ]
      "ence": "uns",    // 發 [əns]
      "ance": "uns",    // 發 [əns]
      "be":   "bih",    // 發 [bɪ]
      "gual": "gwull",  // 發 [gwəl]
      "gy":   "gee",    // 字尾 gy 發 [dʒi]
      "cy":   "see",
      "sy":   "zee",
      "ty":   "tea",
      "dy":   "dee",
      "ly":   "lee",
      "ny":   "knee",
      "py":   "pea",
      "by":   "bee",
      "ry":   "ree",
      "my":   "me",
      "phy":  "fee",
      "tion": "shun",
      "sion": "zhun",
      "ture": "cher",
      "ple":  "puhl",
      "tle":  "tuhl",
      "cle":  "kuhl",
      "de":   "dih",
      "re":   "rih",
      "pre":  "prih",
      "a":    "uh",
      "o":    "uh"
    };

    function resolvePositionAwareHomophone(letters, sylIdx, totalSyls, group = null) {
      const low = (letters || "").trim().toLowerCase();
      const isFirst = (sylIdx === 0);
      const isLast = (sylIdx === totalSyls - 1);

      if (low === "the") {
        const hasVoicedDh = group && group.some(p => p.base === "DH");
        return hasVoicedDh ? "the" : "thuhh";
      }
      if (low === "ex" && isFirst) {
        // 若第一節為主重音（如 exercise, expert），發 [ɛks] ("ex")；若為輕音字首（如 experience, excuse），發 [ɪks] 
        const isStressed = group && group.some(p => p.stress === 1);
        return isStressed ? "ex" : "ihks";
      }
      if (low === "bi" && isFirst) {
        return "buy";
      }
      if (low === "gy" && isLast && totalSyls > 1) {
        return "gee";
      }
      if (isFirst && low.startsWith("gy")) {
        if (low === "gy") return "juh";
        if (low === "gym") return "jim";
        return "j" + low.slice(1);
      }

      return REAL_WORD_HOMOPHONES[low] || null;
    }

    const ARPABET_TO_SOUND = {
      "AA": { kk: "ɑ",  openTts: "ah",  closedV: "o",   isVowel: true },
      "AE": { kk: "æ",  openTts: "aa",  closedV: "a",   isVowel: true },
      "AH": { kk: "ʌ",  openTts: "uh",  closedV: "u",   isVowel: true },
      "AO": { kk: "ɔ",  openTts: "aw",  closedV: "aw",  isVowel: true },
      "AW": { kk: "aʊ", openTts: "ow",  closedV: "ow",  isVowel: true },
      "AY": { kk: "aɪ", openTts: "eye", closedV: "igh", isVowel: true },
      "EH": { kk: "ɛ",  openTts: "eh",  closedV: "e",   isVowel: true },
      "ER": { kk: "ɝ",  openTts: "er",  closedV: "er",  isVowel: true },
      "EY": { kk: "e",  openTts: "ay",  closedV: "ay",  isVowel: true },
      "IH": { kk: "ɪ",  openTts: "ih",  closedV: "i",   isVowel: true },
      "IY": { kk: "i",  openTts: "ee",  closedV: "ee",  isVowel: true },
      "OW": { kk: "o",  openTts: "oh",  closedV: "oh",  isVowel: true },
      "OY": { kk: "ɔɪ", openTts: "oy",  closedV: "oy",  isVowel: true },
      "UH": { kk: "ʊ",  openTts: "oo",  closedV: "oo",  isVowel: true },
      "UW": { kk: "u",  openTts: "oo",  closedV: "oo",  isVowel: true },
      "B":  { kk: "b",  onset: "b",  coda: "b",  isVowel: false },
      "CH": { kk: "tʃ", onset: "ch", coda: "ch", isVowel: false },
      "D":  { kk: "d",  onset: "d",  coda: "d",  isVowel: false },
      "DH": { kk: "ð",  onset: "th", coda: "th", isVowel: false },
      "F":  { kk: "f",  onset: "f",  coda: "f",  isVowel: false },
      "G":  { kk: "g",  onset: "g",  coda: "g",  isVowel: false },
      "HH": { kk: "h",  onset: "h",  coda: "",   isVowel: false },
      "JH": { kk: "dʒ", onset: "j",  coda: "dge",isVowel: false },
      "K":  { kk: "k",  onset: "k",  coda: "ck", isVowel: false },
      "L":  { kk: "l",  onset: "l",  coda: "ll", isVowel: false },
      "M":  { kk: "m",  onset: "m",  coda: "m",  isVowel: false },
      "N":  { kk: "n",  onset: "n",  coda: "n",  isVowel: false },
      "NG": { kk: "ŋ",  onset: "ng", coda: "ng", isVowel: false },
      "P":  { kk: "p",  onset: "p",  coda: "p",  isVowel: false },
      "R":  { kk: "r",  onset: "r",  coda: "r",  isVowel: false },
      "S":  { kk: "s",  onset: "s",  coda: "ss", isVowel: false },
      "SH": { kk: "ʃ",  onset: "sh", coda: "sh", isVowel: false },
      "T":  { kk: "t",  onset: "t",  coda: "t",  isVowel: false },
      "TH": { kk: "θ",  onset: "th", coda: "th", isVowel: false },
      "V":  { kk: "v",  onset: "v",  coda: "ve", isVowel: false },
      "W":  { kk: "w",  onset: "w",  coda: "",   isVowel: false },
      "Y":  { kk: "j",  onset: "y",  coda: "",   isVowel: false },
      "Z":  { kk: "z",  onset: "z",  coda: "z",  isVowel: false },
      "ZH": { kk: "ʒ",  onset: "zh", coda: "zh", isVowel: false }
    };

    // 內建精準單字庫
    const PRESET_DB = {
      experience: {
        word: "experience", pos: "n./v.", meaning: "經驗、經歷、體驗",
        kk_full: "[ɪkˋspɪrɪəns]",
        syllables: [
          { letters: "ex", tts_sound: "ihks", sub_steps: [{ label: "ex", tts: "ɪks" }], desc: "第 1 節：ex [ɪks]" },
          { letters: "pe", tts_sound: "pih", sub_steps: [{ label: "pe", tts: "pih" }], desc: "第 2 節：pe [pɪ]" },
          { letters: "ri", tts_sound: "rih", sub_steps: [{ label: "ri", tts: "rih" }], desc: "第 3 節：ri [rɪ]" },
          { letters: "ence", tts_sound: "uns", sub_steps: [{ label: "ence", tts: "uns" }], desc: "第 4 節：ence [əns]" }
        ],
        tip: "依序練習：ex [ɪks] ➔ pe [pɪ] ➔ ri [rɪ] ➔ ence [əns] ➔ experience！"
      },
      impossible: {

        syllables: [

      },
      synthesis: {

        syllables: [

    let currentData = PRESET_DB.experience;

    // =========================================================================
    // 1. 背景自動鎖定美式口音
    // =========================================================================
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = window.speechSynthesis.getVoices();
      if (allVoices.length === 0) return;

      let usVoicesList = allVoices.filter(v => v.lang === 'en-US' || v.lang === 'en_US');
      if (usVoicesList.length === 0) {
        usVoicesList = allVoices.filter(v => v.lang.startsWith('en'));
      }

      const preferredOrder = ['Google US English', 'Samantha', 'Ava', 'Allison', 'Aria', 'Jenny', 'Guy', 'Alex', 'Natural', 'Microsoft'];
      usVoicesList.sort((a, b) => {
        const scoreA = preferredOrder.findIndex(k => a.name.includes(k));
        const scoreB = preferredOrder.findIndex(k => b.name.includes(k));
        const rankA = scoreA === -1 ? 999 : scoreA;
        const rankB = scoreB === -1 ? 999 : scoreB;
        return rankA - rankB;
      });

      selectedVoice = usVoicesList[0] || allVoices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function normalizeForReliableTts(rawText) {
      let clean = (rawText || "").trim().toLowerCase();
      clean = clean.replace(/[.!?]+$/, "");

      if (clean === "im" || clean === "'im" || clean === "imm") return "imme";
      if (clean === "pos" || clean === "pahs" || clean === "pahss") return "poss";
      if (clean === "si" || clean === "suh") return "suhh";
      if (clean === "ble" || clean === "bull") return "buhl";
      if (clean === "syn") return "sin";
      if (clean === "sis") return "siss";
      if (clean === "gual") return "gwull";
      if (clean === "be") return "bih";
      if (clean === "pe") return "pih";
      if (clean === "ri") return "rih";
      if (clean === "icks" || clean === "yiks" || clean === "ix") return "ihks";
      if (clean === "gy") return "gee";

      return clean;
    }

    function speakText(text, rate = globalSpeechRate, onEndCallback = null) {
      const safeSpeechText = normalizeForReliableTts(text);
      const safeRate = safeSpeechText.length <= 6 ? Math.max(0.68, rate) : rate;

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();

          setTimeout(() => {
            const utter = new SpeechSynthesisUtterance(safeSpeechText);
            utter.lang = 'en-US';
            if (selectedVoice) utter.voice = selectedVoice;
            utter.rate = safeRate;
            utter.pitch = 1.0;
            utter.volume = 1.0;
            if (onEndCallback) {
              utter.onend = onEndCallback;
              utter.onerror = onEndCallback;
            }
            window.speechSynthesis.speak(utter);
          }, 25);
          return;
        } catch (e) {}
      }

      const fallbackUrl = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=en-US&q=${encodeURIComponent(safeSpeechText)}`;
      const audio = new Audio(fallbackUrl);
      audio.playbackRate = Math.max(0.55, safeRate);
      if (onEndCallback) audio.onended = onEndCallback;
      audio.play().catch(() => { if (onEndCallback) onEndCallback(); });
    }

    // =========================================================================
    // 2. 動態單字音節合成
    // =========================================================================
    function synthesizePhonemeGroupToTts(letters, group, sylIdx, totalSyls) {
      const low = (letters || "").toLowerCase().trim();
      const posHomophone = resolvePositionAwareHomophone(low, sylIdx, totalSyls, group);
      if (posHomophone) return posHomophone;

      if (!group || group.length === 0) return low;
      const vPos = group.findIndex(p => p.isVowel);
      if (vPos === -1) return low;

      const vowelObj = group[vPos];
      const onset = group.slice(0, vPos).map(p => p.onset).join("");
      const coda = group.slice(vPos + 1).map(p => p.coda).join("");

      if (!coda) {
        if (onset === "th" && !group.some(p => p.base === "DH")) return "thuhh";
        if (onset === "s" && vowelObj.base === "AH") return "suhh";
        if (vowelObj.base === "IH") return onset + "ih";
        if (vowelObj.base === "AH") return onset + "uh";
        if (vowelObj.base === "AY" && onset === "b") return "buy";
        return onset + vowelObj.openTts;
      }

      if (!onset && vowelObj.base === "IH" && coda === "m") {
        return "imme";
      }

      return onset + vowelObj.closedV + coda;
    }

    function pureSyllableSplitter(word) {
      let w = word.toLowerCase().trim();
      if (w.length <= 3) return [w];

      const prefixes = [];
      if (/^a[bcdfghjklmnpqrstvwxz][aeiouy]/i.test(w)) {
        prefixes.push('a');
        w = w.slice(1);
      } else if (/^ex[bcdfghjklmnpqrstvwxz]/i.test(w)) {
        prefixes.push('ex');
        w = w.slice(2);
      } else if (/^(syn|sym)[bcdfghjklmnpqrstvwxz]/i.test(w)) {
        prefixes.push(w.slice(0, 3));
        w = w.slice(3);
      } else if (/^(im|in)[bcdfghjklmnpqrstvwxz]/i.test(w)) {
        prefixes.push(w.slice(0, 2));
        w = w.slice(2);
      } else if (/^(be|bi)[bcdfghjklmnpqrstvwxz][aeiouy]/i.test(w)) {
        prefixes.push(w.slice(0, 2));
        w = w.slice(2);
      }

      const suffixes = [];
      const endMatch = w.match(/^(.+[aeiouy].*?)(tion|sion|ture|ence|ance|cise|size|gual|ble|ple|tle|cle|sis|gy|cy|sy|ty|dy|ly)$/i);
      if (endMatch) {
        w = endMatch[1];
        suffixes.push(endMatch[2]);
      }

      const digraphRegex = /(tch|dge|ch|sh|th|ph|wh|ck|ng|qu|gu|ea|ee|oo|ou|ow|ai|ay|oi|oy|au|aw|oa|ie|ei)/gi;
      const tokens = [];
      let lastIdx = 0;
      let m;
      while ((m = digraphRegex.exec(w)) !== null) {
        for (let i = lastIdx; i < m.index; i++) tokens.push(w[i]);
        tokens.push(m[0]);
        lastIdx = digraphRegex.lastIndex;
      }
      for (let i = lastIdx; i < w.length; i++) tokens.push(w[i]);

      if (tokens.length >= 3 && tokens[tokens.length - 1] === 'e' && !/[aeiouy]/i.test(tokens[tokens.length - 2])) {
        tokens[tokens.length - 2] += tokens.pop();
      }

      const isVowelTok = t => /[aeiouy]/i.test(t) && !/^(qu|gu)$/i.test(t);
      const vPos = [];
      tokens.forEach((t, idx) => { if (isVowelTok(t)) vPos.push(idx); });

      const stemSyls = [];
      if (vPos.length <= 1) {
        if (tokens.length > 0) stemSyls.push(tokens.join(''));
      } else {
        let start = 0;
        for (let v = 0; v < vPos.length; v++) {
          const currV = vPos[v];
          if (v === vPos.length - 1) {
            stemSyls.push(tokens.slice(start).join(''));
          } else {
            const nextV = vPos[v + 1];
            const consBetween = nextV - currV - 1;
            const cut = consBetween <= 1 ? currV + 1 : currV + 2;
            stemSyls.push(tokens.slice(start, cut).join(''));
            start = cut;
          }
        }
      }
      return [...prefixes, ...stemSyls, ...suffixes];
    }

    function buildSyllablesFromCMUOnly(word, arpabetStr, customLettersArray = null) {
      const rawTokens = arpabetStr ? arpabetStr.trim().split(/\s+/) : [];
      const phonemes = rawTokens.map(tok => {
        const match = tok.match(/^([A-Z]+)([012])?$/);
        const base = match ? match[1] : tok;
        const stress = match && match[2] ? parseInt(match[2], 10) : null;
        const info = ARPABET_TO_SOUND[base] || { kk: base.toLowerCase(), openTts: base.toLowerCase(), closedV: base.toLowerCase(), onset: base.toLowerCase(), coda: base.toLowerCase(), isVowel: false };
        let kkSym = info.kk;
        if (base === 'AH' && stress === 0) kkSym = 'ə';
        if (base === 'ER' && stress === 0) kkSym = 'ɚ';
        if (base === 'IY' && stress === 0) kkSym = 'ɪ';
        return { base, stress, isVowel: info.isVowel, kk: kkSym, openTts: info.openTts, closedV: info.closedV, onset: info.onset, coda: info.coda };
      });

      const vowelIndices = [];
      phonemes.forEach((p, idx) => { if (p.isVowel) vowelIndices.push(idx); });
      const letterSyls = customLettersArray || pureSyllableSplitter(word);

      if (vowelIndices.length === 0) {
        return {
          kkFull: `[${word}]`,
          syllables: letterSyls.map((letters, idx) => {
            const homophone = resolvePositionAwareHomophone(letters, idx, letterSyls.length) || letters;
            return { letters, tts_sound: homophone, sub_steps: [{ label: letters, tts: homophone }], desc: `第 ${idx + 1} 節` };
          })
        };
      }

      const sylPhonemeGroups = [];
      let startIdx = 0;
      for (let v = 0; v < vowelIndices.length; v++) {
        const currV = vowelIndices[v];
        if (v === vowelIndices.length - 1) {
          sylPhonemeGroups.push(phonemes.slice(startIdx));
        } else {
          const nextV = vowelIndices[v + 1];
          const consBetween = nextV - currV - 1;
          let splitPoint = consBetween <= 1 ? currV + 1 : currV + 2;
          if (v === 0 && (letterSyls[0] || '').toLowerCase() === 'ex') {
            while (splitPoint < nextV && (phonemes[splitPoint].base === 'K' || phonemes[splitPoint].base === 'S')) splitPoint++;
          }
          sylPhonemeGroups.push(phonemes.slice(startIdx, splitPoint));
          startIdx = splitPoint;
        }
      }

      while (letterSyls.length < sylPhonemeGroups.length) {
        const longestIdx = letterSyls.reduce((maxI, el, i, arr) => el.length > arr[maxI].length ? i : maxI, 0);
        const target = letterSyls[longestIdx];
        const mid = Math.ceil(target.length / 2);
        letterSyls.splice(longestIdx, 1, target.slice(0, mid), target.slice(mid));
      }
      while (letterSyls.length > sylPhonemeGroups.length && letterSyls.length > 1) {
        const last = letterSyls.pop();
        letterSyls[letterSyls.length - 1] += last;
      }

      const kkFullParts = [];
      const totalSyls = sylPhonemeGroups.length;

      const syllables = sylPhonemeGroups.map((group, idx) => {
        const letters = letterSyls[idx] || word;
        const lowLetters = letters.toLowerCase();
        const vPos = group.findIndex(p => p.isVowel);
        const vowelObj = group[vPos] || group[0];
        const isStressed = vowelObj.stress === 1 && totalSyls > 1;
        const isSecondary = vowelObj.stress === 2 && totalSyls > 1;
        const kkStress = isStressed ? 'ˋ' : (isSecondary ? 'ˌ' : '');

        kkFullParts.push(kkStress + group.map(p => p.kk).join(''));

        const exactSylTts = synthesizePhonemeGroupToTts(letters, group, idx, totalSyls);
        const onsetAndVowel = group.slice(0, vPos + 1);
        const coda = group.slice(vPos + 1);

        const subSteps = [];
        const isLockedShortSyl = Boolean(resolvePositionAwareHomophone(lowLetters, idx, totalSyls, group));
        if (!isLockedShortSyl && coda.length > 0 && letters.length >= 3) {
          const cvMatch = letters.match(/^([^aeiouy]*(?:ea|ee|oo|ou|ow|ai|ay|oi|oy|au|aw|oa|ie|[aeiouy])+)/i);
          const cvText = cvMatch ? cvMatch[1] : letters.slice(0, -1);
          if (cvText.toLowerCase() !== lowLetters) {
            const cvTts = synthesizePhonemeGroupToTts(cvText, onsetAndVowel, idx, totalSyls);
            subSteps.push({ label: cvText, tts: cvTts });
          }
        }
        subSteps.push({ label: letters, tts: exactSylTts });

        return {
          letters,
          tts_sound: exactSylTts,
          sub_steps: subSteps,
          desc: `第 ${idx + 1} 節：${letters}`
        };
      });

      return { kkFull: `[${kkFullParts.join('')}]`, syllables };
    }

    // =========================================================================
    // 3. 畫面渲染
    // =========================================================================
    function renderWordData(data) {
      currentData = data;
      const sylJoin = (data.syllables || []).map(s => s.letters).join('·') || data.word;
      document.getElementById('displayWord').textContent = sylJoin;
      document.getElementById('customSplitInput').value = (data.syllables || []).map(s => s.letters).join('-');
      document.getElementById('displayKK').textContent = data.kk_full || `[${data.word}]`;
      document.getElementById('displayPos').textContent = data.pos || 'word';
      document.getElementById('displayMeaning').textContent = data.meaning || '';
      document.getElementById('classroomTitle').textContent = `💡 美式分節拼讀指引：${data.word}`;
      document.getElementById('classroomDesc').textContent = data.tip || '點擊上方各節拼音方塊，練習各音節清晰自然發音。';

      const grid = document.getElementById('syllablesGrid');
      grid.innerHTML = '';
      const totalSyls = (data.syllables || []).length;

      (data.syllables || []).forEach((syl, sIdx) => {
        const cardId = `syl-card-${sIdx}`;

        if (!syl.tts_sound) {
          syl.tts_sound = resolvePositionAwareHomophone(syl.letters, sIdx, totalSyls) || syl.letters;
        }

        const subSteps = (syl.sub_steps && syl.sub_steps.length > 0)
          ? syl.sub_steps.map(st => {
              const cleanLabel = (st.label || syl.letters).replace(/\s*\[.*?\]/g, '').replace(/\s*\/.*?\//g, '');
              return { label: cleanLabel, tts: st.tts || syl.tts_sound || syl.letters };
            })
          : [{ label: syl.letters, tts: syl.tts_sound || syl.letters }];

        const subBtnsHtml = subSteps.map(st => {
          const safeTts = (st.tts || syl.letters).replace(/'/g, "\\'");
          return `
            <button type="button" onclick="event.stopPropagation(); playSingleSyllable(${sIdx}, '${safeTts}', '${st.label}')"
              class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-cyan-600 text-base font-extrabold text-cyan-200 hover:text-white border border-slate-600 transition cursor-pointer shadow-sm">
              🔊 ${st.label}
            </button>
          `;
        }).join(' <span class="text-slate-400 font-bold text-sm mx-0.5">➔</span> ');

        const card = document.createElement('div');
        card.id = cardId;
        card.onclick = () => playSingleSyllable(sIdx);
        card.className = 'step-btn rounded-2xl p-5 text-left transition cursor-pointer flex flex-col justify-between shadow border bg-slate-900/90 border-slate-700 hover:border-cyan-400';

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300">
                第 ${sIdx + 1} 節
              </span>
              <span class="text-xs text-cyan-300 font-semibold">🔊 點擊聽此節</span>
            </div>
            <div class="my-2">
              <span class="text-4xl font-extrabold text-white tracking-wider">${syl.letters}</span>
            </div>
          </div>

          <div class="mt-3 pt-3 border-t border-slate-800 space-y-2">
            <div class="text-xs text-slate-400">分節拼音帶讀：</div>
            <div class="flex flex-wrap items-center gap-1.5">${subBtnsHtml}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function playSingleSyllable(sIdx, customTts = null, displayLabel = null) {
      isGuidingSyllables = false;
      document.getElementById('stepGuideBtn').innerHTML = '▶️ 分節慢速帶讀 (一節一節跟讀)';
      const syl = currentData.syllables[sIdx];
      if (!syl) return;

      document.querySelectorAll('.step-btn').forEach(el => el.classList.remove('playing-glow'));
      const cardEl = document.getElementById(`syl-card-${sIdx}`);
      if (cardEl) cardEl.classList.add('playing-glow');

      const soundToPlay = customTts || syl.tts_sound || syl.letters;
      const shownText = displayLabel || syl.letters;
      document.getElementById('classroomTitle').innerHTML = 
        `🔊 正在帶讀第 ${sIdx + 1} 節：<span class="text-amber-400 font-mono text-lg">${shownText}</span>`;
      document.getElementById('classroomDesc').textContent = syl.desc || '';

      speakText(soundToPlay, globalSpeechRate, () => {
        if (cardEl) cardEl.classList.remove('playing-glow');
      });
    }

    function playSyllableBySyllableGuide() {
      const btn = document.getElementById('stepGuideBtn');
      if (isGuidingSyllables) {
        isGuidingSyllables = false;
        window.speechSynthesis.cancel();
        btn.innerHTML = '▶️ 分節慢速帶讀 (一節一節跟讀)';
        return;
      }

      isGuidingSyllables = true;
      btn.innerHTML = '⏹ 停止分節帶讀';
      const pauseMs = parseInt(document.getElementById('pauseDurationSelect').value, 10) || 1400;
      const syls = currentData.syllables || [];
      let idx = 0;

      function nextSyl() {
        if (!isGuidingSyllables) {
          btn.innerHTML = '▶️ 分節慢速帶讀 (一節一節跟讀)';
          return;
        }
        document.querySelectorAll('.step-btn').forEach(el => el.classList.remove('playing-glow'));

        if (idx < syls.length) {
          const syl = syls[idx];
          const cardEl = document.getElementById(`syl-card-${idx}`);
          if (cardEl) cardEl.classList.add('playing-glow');

          document.getElementById('classroomTitle').innerHTML = 
            `👂 分節帶讀 (${idx + 1}/${syls.length})：請聽 <span class="text-amber-400 font-mono text-lg">${syl.letters}</span> 並開口跟讀！`;
          document.getElementById('classroomDesc').textContent = `留白 ${(pauseMs/1000).toFixed(1)} 秒供學生跟讀模仿`;

          idx++;
          speakText(syl.tts_sound || syl.letters, globalSpeechRate, () => {
            setTimeout(() => {
              if (cardEl) cardEl.classList.remove('playing-glow');
              nextSyl();
            }, pauseMs);
          });
        } else {
          document.getElementById('classroomTitle').innerHTML = 
            `🎯 最終整字連讀：<span class="text-cyan-300 font-mono text-lg">${syls.map(s => s.letters).join(' · ')} ➔ ${currentData.word}</span>`;
          document.getElementById('classroomDesc').textContent = '把剛剛分節練習的聲音連貫合起來！';
          speakText(currentData.word, 0.75, () => {
            setTimeout(() => {
              if (!isGuidingSyllables) return;
              speakText(currentData.word, 0.95, () => {
                isGuidingSyllables = false;
                btn.innerHTML = '▶️ 分節慢速帶讀 (一節一節跟讀)';
              });
            }, 650);
          });
        }
      }

      nextSyl();
    }

    function playWholeWord(rate = 0.95) {
      isGuidingSyllables = false;
      document.getElementById('stepGuideBtn').innerHTML = '▶️ 分節慢速帶讀 (一節一節跟讀)';
      const titleEl = document.getElementById('displayWord');
      titleEl.classList.add('text-cyan-400');
      speakText(currentData.word, rate, () => titleEl.classList.remove('text-cyan-400'));
    }

    function setSpeechSpeed(rate) {
      globalSpeechRate = rate;
      [0.55, 0.7, 0.85, 1.0].forEach(r => {
        const btn = document.getElementById(`speedBtn-${r}`);
        if (!btn) return;
        btn.className = (r === rate)
          ? "px-2.5 py-1 rounded bg-cyan-600 text-white font-bold border border-cyan-400 cursor-pointer"
          : "px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 cursor-pointer";
      });
    }

    async function analyzeWord() {
      const rawInput = document.getElementById('wordInput').value.trim();
      if (!rawInput) return;
      const key = rawInput.toLowerCase();

      const matchedPresetKey = Object.keys(PRESET_DB).find(k => k.toLowerCase() === key);
      if (matchedPresetKey) {
        loadPreset(matchedPresetKey);
        playSyllableBySyllableGuide();
        return;
      }

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ 分析美式音節中...</span>';

      let arpabetStr = "";
      let pos = "word";
      let meaning = "";

      try {
        const [cmuRes, dictRes, transRes] = await Promise.allSettled([
          fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(key)}&md=pr&max=1`),
          fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`),
          fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(key)}&langpair=en|zh-TW`)
        ]);

        if (cmuRes.status === 'fulfilled' && cmuRes.value.ok) {
          const cmuArr = await cmuRes.value.json();
          if (cmuArr[0] && cmuArr[0].word.toLowerCase() === key) {
            const pronTag = (cmuArr[0].tags || []).find(t => t.startsWith('pron:'));
            if (pronTag) arpabetStr = pronTag.replace('pron:', '').trim();
          }
        }

        if (dictRes.status === 'fulfilled' && dictRes.value.ok) {
          const arr = await dictRes.value.json();
          const entry = arr[0];
          if (entry.meanings && entry.meanings[0]) {
            pos = entry.meanings[0].partOfSpeech || pos;
            meaning = entry.meanings[0].definitions?.[0]?.definition || "";
          }
        }

        if (transRes.status === 'fulfilled' && transRes.value.ok) {
          const transData = await transRes.value.json();
          const zh = transData?.responseData?.translatedText;
          if (zh) meaning = meaning ? `${zh} (${meaning})` : zh;
        }

        const built = buildSyllablesFromCMUOnly(rawInput, arpabetStr);
        const newWordData = {
          word: rawInput,
          pos,
          meaning: meaning || "已完成美式音節拆解",
          kk_full: built.kkFull,
          syllables: built.syllables,
          tip: `已將「${rawInput}」拆解為 ${built.syllables.map(s => s.letters).join(' · ')}，請點擊各節卡片進行慢速拼讀練習。`
        };

        PRESET_DB[key] = newWordData;
        renderPresetButtons();
        renderWordData(newWordData);
        playSyllableBySyllableGuide();
      } catch (e) {
        console.warn(e);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🔍 開始分節拼讀</span>';
      }
    }

    function applyCustomSyllableSplit() {
      const raw = document.getElementById('customSplitInput').value.trim();
      if (!raw) return;
      const parts = raw.split(/[-·.\s]+/).filter(Boolean);
      if (parts.length === 0) return;

      currentData.syllables = parts.map((letters, idx) => {
        const oldSyl = currentData.syllables?.[idx] || {};
        const homophone = resolvePositionAwareHomophone(letters, idx, parts.length) || oldSyl.tts_sound || letters;
        return {
          letters,
          tts_sound: homophone,
          sub_steps: [{ label: letters, tts: homophone }],
          desc: `第 ${idx + 1} 節：${letters}`
        };
      });
      renderWordData(currentData);
    }

    function renderPresetButtons() {
      const container = document.getElementById('presetButtons');
      container.innerHTML = '';
      Object.keys(PRESET_DB).forEach(wordKey => {
        const item = PRESET_DB[wordKey];
        const btn = document.createElement('button');
        btn.className = 'px-3 py-1 bg-slate-700/80 hover:bg-cyan-600 hover:text-white rounded-lg text-cyan-300 transition cursor-pointer text-xs font-mono';
        btn.textContent = item.word;
        btn.onclick = () => loadPreset(wordKey);
        container.appendChild(btn);
      });
    }

    function loadPreset(wordKey) {
      if (!PRESET_DB[wordKey]) return;
      isGuidingSyllables = false;
      document.getElementById('wordInput').value = PRESET_DB[wordKey].word;
      renderWordData(PRESET_DB[wordKey]);
    }

    async function syncGithubSchemaSilently() {
      const urls = [GITHUB_RAW_COMMIT_URL, GITHUB_RAW_MAIN_URL, LOCAL_SCHEMA_URL];
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.ok) {
            const parsed = await res.json();
            const db = parsed.words_database || parsed;
            if (typeof db === 'object' && !Array.isArray(db)) {
              Object.keys(db).forEach(k => {
                if (db[k]?.word && !PRESET_DB[k.toLowerCase()]) {
                  PRESET_DB[k.toLowerCase()] = db[k];
                }
              });
            }
            break;
          }
        } catch (e) {}
      }
      renderPresetButtons();
    }

    // =========================================================================
    // 4. Echo 回音法與錄音比對
    // =========================================================================
    async function startRecording(durationMs = null) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('請在 GitHub Pages (https://) 網址下開啟網頁以使用麥克風！');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          recordedAudioUrl = URL.createObjectURL(blob);
          document.getElementById('compareBtn').disabled = false;
          document.getElementById('recordBtn').classList.remove('recording-pulse');
          document.getElementById('recordBtn').textContent = '🎤 重新錄音';
          document.getElementById('echoStatus').textContent = '✅ 錄音完成！點擊「連續播放對比」聽聽看自己的發音。';
          isRecording = false;
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        document.getElementById('recordBtn').classList.add('recording-pulse');
        document.getElementById('recordBtn').textContent = '⏹ 停止錄音';
        if (durationMs) {
          setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
          }, durationMs);
        }
      } catch (err) {
        alert('無法開啟麥克風：' + err.message);
      }
    }

    function toggleManualRecord() {
      if (isRecording && mediaRecorder) {
        mediaRecorder.stop();
      } else {
        document.getElementById('echoStatus').textContent = '🔴 正在錄音中... 請大聲唸出單字';
        startRecording();
      }
    }

    function startEchoLoop() {
      const status = document.getElementById('echoStatus');
      status.textContent = '👂 階段 1/3：請仔細聽美式標準發音...';
      speakText(currentData.word, globalSpeechRate, () => {
        status.textContent = '🧠 階段 2/3：請在心裡「默唸回音」2 秒鐘...';
        setTimeout(() => {
          status.textContent = '🗣️ 階段 3/3：請開口唸出來！（系統自動錄音 3 秒）';
          startRecording(3000);
        }, 2000);
      });
    }

    function playComparison() {
      if (!recordedAudioUrl) return;
      const status = document.getElementById('echoStatus');
      status.textContent = '🔊 正在播放：美式標準音...';
      speakText(currentData.word, globalSpeechRate, () => {
        setTimeout(() => {
          status.textContent = '🎧 正在播放：您的錄音...';
          const myAudio = new Audio(recordedAudioUrl);
          myAudio.onended = () => { status.textContent = '✨ 比對完畢！'; };
          myAudio.play();
        }, 350);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initVoices();
      renderPresetButtons();
      renderWordData(currentData);
      syncGithubSchemaSilently();
    });
  </script>
</body>

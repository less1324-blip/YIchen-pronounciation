<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="懿城文教機構-林哲宇">
  <meta name="copyright" content="懿城文教機構-林哲宇">
  <title>英語音標拆解與回音發音訓練系統 | 懿城文教機構-林哲宇</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .phoneme-btn { transition: all 0.15s ease; }
    .phoneme-btn:active { transform: scale(0.93); }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .recording-pulse { animation: pulse-ring 1.5s infinite; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4 md:p-8 flex flex-col justify-between">

  <div class="max-w-4xl mx-auto w-full space-y-6">
    <!-- 頂部標題、品牌標示與 API 設定 -->
    <header class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-semibold mb-2">
          <span>🏫 懿城文教機構 · 數位教學研發</span>
          <span>|</span>
          <span>林哲宇 老師監製</span>
        </div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
          英語音標拆解與 Echo 發音教練
        </h1>
        <p class="text-slate-400 text-sm mt-1">GitHub 雲端詞庫同步 · 口腔發音部位導航 · 回音記憶對比</p>
      </div>
      <div class="flex flex-col items-end gap-2 w-full md:w-auto">
        <input id="apiKeyInput" type="password" placeholder="貼上 Gemini API Key (動態擴充單字)" 
          class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 w-full md:w-64">
        <div class="flex items-center gap-2 text-xs">
          <span id="githubSyncStatus" class="text-amber-400">⏳ 正在連線至 GitHub 詞庫...</span>
          <a href="https://github.com/less1324-blip/YIchen-pronounciation/blob/900cfe5de5616e727538f2f108435bd0be2af777/phonetic_schema.json.json" 
             target="_blank" rel="noopener noreferrer"
             class="text-cyan-400 hover:underline">查看 GitHub 原始檔 ↗</a>
        </div>
      </div>
    </header>

    <!-- 單字搜尋列 -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-lg">
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="wordInput" type="text" value="fantastic" placeholder="輸入想練習的英文單字..." 
          class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg font-medium text-white focus:outline-none focus:border-cyan-400">
        <button onclick="analyzeWord()" id="analyzeBtn"
          class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center justify-center gap-2">
          <span>拆解音標</span>
        </button>
        <button onclick="fetchGithubJson()" 
          class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-4 py-3 rounded-xl transition text-sm">
          🔄 重新同步 GitHub
        </button>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-400">
        <span>詞庫快速載入：</span>
        <div id="presetButtons" class="flex flex-wrap gap-2">
          <!-- 由 GitHub JSON 與內建詞庫動態產生按鈕 -->
        </div>
        <span class="ml-auto text-slate-500">*填入 API Key 即可即時拆解任意新單字</span>
      </div>
    </section>

    <!-- 單字總覽與整字發音 -->
    <section id="resultContainer" class="space-y-6">
      <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-lg">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-700 pb-5">
          <div>
            <div class="flex items-baseline gap-4 flex-wrap">
              <h2 id="displayWord" class="text-4xl font-extrabold text-white tracking-wide">fantastic</h2>
              <span id="displayKK" class="text-xl font-mono text-amber-400">[fænˋtæstɪk]</span>
              <span id="displayIPA" class="text-lg font-mono text-slate-400">/fænˈtæstɪk/</span>
            </div>
            <p class="mt-2 text-lg text-slate-200">
              <span id="displayPos" class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded text-sm font-mono mr-2">adj.</span>
              <span id="displayMeaning">極好的、異想天開的、不可思議的</span>
            </p>
          </div>
          <div class="flex gap-2">
            <button onclick="speakText(currentData.word, 0.9)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium transition flex items-center gap-2">
              🔊 正常語速
            </button>
            <button onclick="speakText(currentData.word, 0.5)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl font-medium transition flex items-center gap-2">
              🐢 慢速拆讀
            </button>
          </div>
        </div>

        <!-- 音節與音標拆解區 -->
        <div class="mt-6">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">
              步驟 1：點擊音節或單一音標模仿發音（紅框為母音、藍框為子音）
            </h3>
          </div>
          <div id="syllablesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- 動態渲染音節卡片 -->
          </div>
        </div>

        <!-- 口腔發音部位提示區 -->
        <div id="articulationBox" class="mt-5 bg-slate-900/90 border border-cyan-500/40 rounded-xl p-4 flex items-start gap-3">
          <div class="text-2xl">👄</div>
          <div>
            <div class="text-sm font-bold text-cyan-400" id="activePhonemeTitle">點擊上方任一音標積木查看發音
